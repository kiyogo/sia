[workspace]
resolver = "2"
members = [
    "crates/agent-platform",
    "crates/agent-security",
    "crates/agent-storage",
    "crates/agent-tools",
    "crates/agent-core",
    "crates/agent-runtime",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Autonomous AI Workspace Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aai/aai-workspace"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
async-trait = "0.1"
walkdir = "2.5"
regex = "1.11"
similar = "2.6"
tempfile = "3.13"
sysinfo = "0.33"
windows-service = "0.8"

# Internal crates
agent-platform = { path = "crates/agent-platform" }
agent-security = { path = "crates/agent-security" }
agent-storage = { path = "crates/agent-storage" }
agent-tools = { path = "crates/agent-tools" }
agent-core = { path = "crates/agent-core" }
agent-runtime = { path = "crates/agent-runtime" }
